<!DOCTYPE html>
<html>
<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    font-family: Arial, sans-serif;
">

    <div style="
        max-width: 600px;
        margin: 40px auto;
        background-color: white;
        padding: 40px;
        border-radius: 10px;
    ">

        <h1 style="
            color: #333;
            text-align: center;
        ">
            Bem-vindo! 👋
        </h1>

        <p style="
            color: #555;
            font-size: 16px;
        ">
            Obrigado por se cadastrar na nossa plataforma.
        </p>

        <p style="
            color: #555;
            font-size: 16px;
        ">
            Para ativar sua conta, clique no botão abaixo:
        </p>

        <div style="text-align: center; margin: 30px 0;">

            <a href="{{ url_confirmation }}"
               style="
                   display: inline-block;
                   padding: 14px 25px;
                   background-color: #2563eb;
                   color: white;
                   text-decoration: none;
                   border-radius: 6px;
                   font-weight: bold;
               ">
                Confirmar minha conta
            </a>

        </div>

        <p style="
            color: #888;
            font-size: 13px;
        ">
            Se você não criou uma conta, pode ignorar este e-mail.
        </p>

    </div>

</body>
</html>
